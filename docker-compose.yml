services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tamago
      POSTGRES_PASSWORD: tamago
      POSTGRES_DB: tamago
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamago"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    image: adobe/s3mock
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: tamago
    ports:
      - "9090:9090"

volumes:
  pgdata:
