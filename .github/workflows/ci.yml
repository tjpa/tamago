name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tamago
          POSTGRES_PASSWORD: tamago
          POSTGRES_DB: tamago_test
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U tamago" --health-interval 3s
          --health-timeout 3s --health-retries 20
      s3:
        image: adobe/s3mock
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: tamago
        ports: ["9090:9090"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations apply and match the models
        env:
          TAMAGO_DATABASE_URL: postgresql+psycopg://tamago:tamago@localhost:5442/tamago_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
